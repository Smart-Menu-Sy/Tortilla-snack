<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo } = React;

    const RAW_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCRSNikIu7I5siUPfUBq0hqUOXj2TrA-Vjvh3gadJCE3tqyB8P7KejE9NILzUKw6MbTNuS_sWvONql/pubhtml?gid=0&single=true";

    function getCsvUrl(url) {
      if (url.includes('/pubhtml')) {
        return url.replace('/pubhtml', '/pub') + (url.includes('?') ? '&' : '?') + 'output=csv';
      }
      return url;
    }

    const Icon = ({ children, size = 20, className = '' }) => React.createElement("svg", {
      width: size, height: size, viewBox: "0 0 24 24", fill: "none",
      stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className: className
    }, children);

    const SearchIcon = props => React.createElement(Icon, props, React.createElement("circle", { cx: "11", cy: "11", r: "8" }), React.createElement("path", { d: "m21 21-4.3-4.3" }));
    const PlusIcon = props => React.createElement(Icon, props, React.createElement("path", { d: "M5 12h14" }), React.createElement("path", { d: "M12 5v14" }));
    const XIcon = props => React.createElement(Icon, props, React.createElement("path", { d: "M18 6 6 18" }), React.createElement("path", { d: "m6 6 12 12" }));
    const UtensilsIcon = props => React.createElement(Icon, props, React.createElement("path", { d: "M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" }), React.createElement("path", { d: "M7 2v20" }), React.createElement("path", { d: "M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" }));
    const Loader2Icon = props => React.createElement(Icon, { ...props, className: `animate-spin ${props.className || ''}` }, React.createElement("path", { d: "M21 12a9 9 0 1 1-6.219-8.56" }));

    function App() {
      const [items, setItems] = useState([]);
      const [categories, setCategories] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('الكل');
      const [searchQuery, setSearchQuery] = useState('');
      const [cart, setCart] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [customerName, setCustomerName] = useState('');
      const [address, setAddress] = useState('');
      const [notes, setNotes] = useState('');

      useEffect(() => {
        const targetCsvUrl = getCsvUrl(RAW_URL);
        const fetchUrl = `${targetCsvUrl}&t=${new Date().getTime()}`;

        Papa.parse(fetchUrl, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: results => {
            const data = results.data;
            if (!data || data.length === 0) {
              setError('تم الوصول للجدول ولكن لم يتم العثور على أي بيانات داخله.');
              setLoading(false);
              return;
            }
            const cleanData = data.map(item => ({
              name: item.name?.trim() || '',
              category: item.category?.trim() || '',
              desc: item.desc?.trim() || '',
              price: item.price?.trim() || '',
              img: item.img?.trim() || ''
            }));
            const validData = cleanData.filter(item => item.name && item.category);
            
            if (validData.length === 0) {
              setError('يرجى التأكد من أن السطر الأول في شيت Google يحتوي على الترويسات بالإنجليزية: name, category, desc, price, img');
              setLoading(false);
              return;
            }

            setItems(validData);
            const cats = Array.from(new Set(validData.map(item => item.category)));
            setCategories(['الكل', ...cats]);
            setLoading(false);
          },
          error: (err) => {
            setError('تعذّر جلب البيانات. إذا كنت تفتح الملف محلياً (file://)، يرجى رفعه على GitHub Pages ليعمل بشكل صحيح.');
            setLoading(false);
          }
        });
      }, []);

      const getPriceNum = priceStr => {
        if (!priceStr) return 0;
        const num = parseInt(priceStr.toString().replace(/\D/g, ''), 10);
        return isNaN(num) ? 0 : num;
      };

      const addToCart = item => {
        setCart(prev => {
          const existing = prev.find(c => c.item.name === item.name);
          if (existing) {
